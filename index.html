
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenLayer Spinner Concept</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
}
main { text-align: center; }
.spinner {
  width: 90px;
  height: 90px;
  margin: 30px auto;
  position: relative;
  animation: rotate 2s linear infinite;
}
.shape {
  position: absolute;
  inset: 10px;
  border: 5px solid transparent;
  border-top-color: #b6ff6b;
  border-right-color: #9a7bff;
  border-radius: 22px;
}
.shape.two {
  inset: 23px;
  animation: rotate 1s linear infinite reverse;
}
.core {
  position: absolute;
  width: 18px;
  height: 18px;
  background: #b6ff6b;
  border-radius: 5px;
  top: 36px;
  left: 36px;
}
@keyframes rotate {
  to { transform: rotate(360deg); }
}
p { color: #b8b5c9; }
</style>
</head>
<body>
<main>
  <h1>Ideas in Motion</h1>
  <div class="spinner" role="img" aria-label="Animated spinner">
    <div class="shape"></div>
    <div class="shape two"></div>
    <div class="core"></div>
  </div>
  <p>Exploring a decentralized future</p>
  <p>Community Spinner Concept</p>
</main>
</body>
</html>
